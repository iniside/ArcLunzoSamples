<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account settings</title>
  <link href="css/tailwind.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-950 font-sans text-slate-100 antialiased">
  <div class="mx-auto max-w-5xl px-6 py-10">
    <header class="mb-8 flex items-center justify-between">
      <h1 class="text-3xl font-bold tracking-tight">Settings</h1>
      <button class="rounded-lg bg-indigo-500 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500 disabled:opacity-50">Save changes</button>
    </header>

    <div class="grid grid-cols-1 gap-6 md:grid-cols-3">
      <div class="rounded-2xl border border-white/10 bg-white/5 p-6 shadow-xl ring-1 ring-black/5 backdrop-blur">
        <div class="flex items-center gap-4">
          <img class="size-14 rounded-full object-cover" src="img/avatar.png" alt="">
          <div>
            <p class="text-lg font-semibold">Ada Lovelace</p>
            <p class="text-sm text-slate-400">Level 42 &middot; Mage</p>
          </div>
        </div>
        <div class="mt-6 space-y-3">
          <div>
            <div class="mb-1 flex justify-between text-xs text-slate-400"><span>XP</span><span>72%</span></div>
            <div class="h-2 w-full overflow-hidden rounded-full bg-slate-800"><div class="h-full w-[72%] rounded-full bg-gradient-to-r from-indigo-500 to-fuchsia-500"></div></div>
          </div>
          <span class="inline-flex items-center rounded-md bg-emerald-400/10 px-2 py-1 text-xs font-medium text-emerald-400 ring-1 ring-emerald-400/20 ring-inset">Online</span>
        </div>
      </div>

      <form class="space-y-6 rounded-2xl border border-white/10 bg-white/5 p-6 md:col-span-2">
        <div class="grid grid-cols-1 gap-x-6 gap-y-4 sm:grid-cols-2">
          <div>
            <label for="name" class="block text-sm font-medium text-slate-300">Display name</label>
            <input id="name" type="text" value="Ada" class="mt-2 block w-full rounded-md border-0 bg-white/5 px-3 py-1.5 text-white ring-1 ring-white/10 ring-inset placeholder:text-slate-500 focus:ring-2 focus:ring-indigo-500 focus:ring-inset">
          </div>
          <div>
            <label for="region" class="block text-sm font-medium text-slate-300">Region</label>
            <select id="region" class="mt-2 block w-full rounded-md border-0 bg-white/5 px-3 py-1.5 text-white ring-1 ring-white/10 ring-inset">
              <option>Europe</option>
              <option selected>North America</option>
            </select>
          </div>
        </div>
        <fieldset>
          <legend class="text-sm font-semibold text-white">Notifications</legend>
          <div class="mt-4 space-y-3">
            <label class="flex items-center gap-3 text-sm"><input type="checkbox" checked class="size-4 rounded border-white/10 bg-white/5 text-indigo-600 accent-indigo-500"> Friend requests</label>
            <label class="flex items-center gap-3 text-sm"><input type="checkbox" class="size-4 rounded border-white/10 bg-white/5 accent-indigo-500"> Guild invites</label>
          </div>
        </fieldset>
        <div class="flex items-center justify-end gap-x-4 border-t border-white/10 pt-6">
          <button type="button" class="text-sm font-semibold text-slate-300 transition-colors duration-150 hover:text-white">Cancel</button>
          <button type="submit" class="rounded-md bg-indigo-500 px-3 py-2 text-sm font-semibold text-white hover:bg-indigo-400 active:scale-95">Save</button>
        </div>
      </form>
    </div>

    <ul class="mt-8 divide-y divide-white/5 rounded-2xl border border-white/10">
      <li class="flex items-center justify-between px-6 py-4"><span class="truncate">Iron Sword</span><span class="text-amber-400 tabular-nums">300&nbsp;g</span></li>
      <li class="flex items-center justify-between px-6 py-4"><span class="truncate">Oak Shield</span><span class="text-amber-400 tabular-nums">220&nbsp;g</span></li>
    </ul>
    <p class="mt-6 text-center text-xs text-slate-500">&copy; 2026 Example</p>
  </div>
</body>
</html>
