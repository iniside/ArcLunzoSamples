<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings &mdash; Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <style>
    :root { --accent: #4f8cff; --panel: #1b1e24; --text: #e8eaed; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #0e1014; color: var(--text); }
    .page { max-width: 880px; margin: 40px auto; padding: 0 24px; }
    h1 { font-size: 28px; font-weight: 600; margin: 0 0 24px; }
    nav ul { list-style: none; display: flex; gap: 8px; padding: 0; margin: 0 0 24px; }
    nav a { color: var(--text); text-decoration: none; padding: 8px 14px; border-radius: 6px; }
    nav a.active, nav a:hover { background: var(--accent); color: #fff; }
    fieldset { border: 1px solid #2c313a; border-radius: 10px; padding: 16px 20px; margin: 0 0 20px; background: var(--panel); }
    legend { padding: 0 6px; font-weight: 600; }
    .row { display: grid; grid-template-columns: 220px 1fr; align-items: center; gap: 12px; padding: 8px 0; }
    .row + .row { border-top: 1px solid #262a31; }
    label { cursor: pointer; }
    input[type="text"], input[type="email"], input[type="number"], select, textarea {
      width: 100%; padding: 8px 10px; border: 1px solid #353b45; border-radius: 6px; background: #12151a; color: var(--text); font: inherit;
    }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    .actions { display: flex; justify-content: flex-end; gap: 10px; }
    button { padding: 10px 18px; border: 0; border-radius: 6px; font: inherit; cursor: pointer; background: #2c313a; color: var(--text); }
    button.primary { background: var(--accent); color: #fff; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #262a31; }
    kbd { font-family: monospace; background: #2c313a; padding: 2px 6px; border-radius: 4px; }
    footer { margin-top: 32px; font-size: 12px; color: #8a9099; }
    .hint { font-size: 12px; color: #8a9099; }
    @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Settings</h1>
      <nav>
        <ul>
          <li><a href="#video" class="active">Video</a></li>
          <li><a href="#audio">Audio</a></li>
          <li><a href="#controls">Controls</a></li>
          <li><a href="https://example.com/help" target="_blank" rel="noopener">Help</a></li>
        </ul>
      </nav>
    </header>

    <form id="settings" action="/save" method="post" onsubmit="return save(event)">
      <fieldset id="video">
        <legend>Video</legend>
        <div class="row">
          <label for="res">Resolution</label>
          <select id="res" name="res">
            <option value="1280x720">1280 &times; 720</option>
            <option value="1920x1080" selected>1920 &times; 1080</option>
            <option value="2560x1440">2560 &times; 1440</option>
          </select>
        </div>
        <div class="row">
          <label for="fullscreen">Fullscreen</label>
          <input type="checkbox" id="fullscreen" name="fullscreen" checked>
        </div>
        <div class="row">
          <span>Quality</span>
          <div>
            <label><input type="radio" name="quality" value="low"> Low</label>&nbsp;
            <label><input type="radio" name="quality" value="high" checked> High</label>&nbsp;
            <label><input type="radio" name="quality" value="ultra" disabled> Ultra</label>
          </div>
        </div>
        <div class="row">
          <label for="fov">Field of view</label>
          <input type="range" id="fov" name="fov" min="60" max="120" step="1" value="90" oninput="fovOut.value = this.value">
        </div>
      </fieldset>

      <fieldset id="audio">
        <legend>Audio</legend>
        <div class="row">
          <label for="master">Master volume</label>
          <input type="number" id="master" name="master" min="0" max="100" value="80">
        </div>
        <div class="row">
          <label for="name">Player name</label>
          <input type="text" id="name" name="name" placeholder="Your name" maxlength="16" required autofocus>
        </div>
        <div class="row">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="you@example.com">
        </div>
        <div class="row">
          <label for="bio">Bio</label>
          <textarea id="bio" name="bio" rows="3">Hello &amp; welcome!</textarea>
        </div>
      </fieldset>

      <fieldset id="controls">
        <legend>Controls</legend>
        <table>
          <thead><tr><th>Action</th><th>Key</th></tr></thead>
          <tbody>
            <tr><td>Move forward</td><td><kbd>W</kbd></td></tr>
            <tr><td>Jump</td><td><kbd>Space</kbd></td></tr>
            <tr><td>Inventory</td><td><kbd>I</kbd></td></tr>
          </tbody>
        </table>
        <p class="hint">Press <kbd>Esc</kbd> to go back.<br>Changes apply after restart.</p>
      </fieldset>

      <hr>
      <div class="actions">
        <button type="button" onclick="resetDefaults()">Reset</button>
        <button type="submit" class="primary">Save</button>
        <button type="button" disabled>Apply</button>
      </div>
    </form>

    <footer>&copy; 2026 Example Studio &middot; v1.0</footer>
  </div>
  <script>
    function save(e) { e.preventDefault(); console.log('saved'); return false; }
    function resetDefaults() { document.getElementById('settings').reset(); }
    if (a < b && b > c) { console.log("x"); }
  </script>
</body>
</html>
