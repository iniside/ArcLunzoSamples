<!DOCTYPE html>
<html lang="en"><head><style>
    .sc-placeholder{background:color-mix(in srgb,currentColor 8%,transparent);border-radius:2px;overflow:hidden}
    @keyframes sc-shine{0%{background-position:100% 50%}100%{background-position:0% 50%}}
    @media print {
      @page { margin: 0.5cm; }
      #dc-root { height: auto; }
    }
  </style><style>
    body{margin:0;background:rgba(5,7,10,.72);color:#e9ecf1;font-family:'Barlow Condensed',sans-serif}
    .igm-panel{position:absolute;top:50%;left:50%;width:380px;transform:translate(-50%,-50%);padding:24px;border:1px solid #2b313b;border-radius:10px;background:#141820}
    .igm-panel h2{margin:0 0 16px;font-size:28px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
    .igm-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 14px;margin-bottom:8px;border:0;border-radius:6px;background:#1e232d;color:inherit;font:inherit;text-align:left}
    .igm-btn:hover{background:#2a3140}
    .igm-btn kbd{font-family:monospace;font-size:12px;padding:1px 6px;border-radius:3px;background:#0c0f14}
    .igm-hint{margin-top:12px;font-size:12px;color:#8a919d}
  </style>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paused</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600&display=swap" rel="stylesheet">
  <script src="support.js"></script>
</head><body><div id="dc-root" data-screen-label="In-game menu"><div class="sc-host" data-sc-name="InGameMenu" data-dc-tpl="0">
<section class="igm-panel" data-dc-tpl="1">
  <h2 data-dc-tpl="2">Paused</h2>
  <button class="igm-btn" data-action="close" data-dc-tpl="3"><span>Resume</span><kbd>Esc</kbd></button>
  <button class="igm-btn" data-action="open:/ArcRmlUITest/UI/Rml/Settings.rml" data-dc-tpl="3"><span>Settings</span><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" data-lucide="chevron-right" data-rendered="true"><polyline points="9 5 16 12 9 19"></polyline></svg></button>
  <button class="igm-btn" data-action="open:/ArcRmlUITest/UI/Rml/MainMenu.rml" onclick="return confirm('Leave?')" data-dc-tpl="3"><span>Main menu</span><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" data-lucide="house" data-rendered="true"><polyline points="4 11 12 4 20 11"></polyline><rect x="6" y="11" width="12" height="9"></rect></svg></button>
  <p class="igm-hint" data-dc-tpl="4">Progress is saved at every checkpoint &mdash; the last one was 2&nbsp;min ago.</p>
</section>
</div></div>
<script data-dc-script="">if (1 < 2 && window.dc) { dc.mount(document.getElementById('dc-root')); }</script>
</body></html>
