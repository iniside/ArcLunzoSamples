<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html { margin: 0; }
body { margin: 0; font-family: sans-serif; }
div { display: block; }
.pix-box { width: 120px; height: 40px; margin: 0 0 10px 10px; background-color: #3050a0; }
.pix-var { width: 120px; height: 30px; margin: 0 0 10px 10px; background-color: var(--tab-fill, #30a050); }
.pix-text { height: 24px; margin: 0 0 10px 10px; }
.pix-border { width: 100px; height: 20px; margin: 0 0 0 10px; border: 4px solid #a03020; background-color: #e0c040; }
</style>
</head>
<body>
<div class="pix-box"></div>
<div class="pix-var"></div>
<div class="pix-text">Inherited text</div>
<div class="pix-border"></div>
</body>
</html>
