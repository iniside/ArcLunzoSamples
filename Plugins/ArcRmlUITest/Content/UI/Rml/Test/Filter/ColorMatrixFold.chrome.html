<!doctype html><html><head><style>
html,body{margin:0;padding:0;background:#fff}
div{position:absolute;display:block}
.p{width:140px;height:90px;top:20px;background:rgba(200,100,50,0.6)}
.k{left:70px;top:0;width:70px;height:90px;background:rgba(20,90,200,0.8)}
#a{left:20px;filter:contrast(1.5) blur(4px) invert(0.8)}
#b{left:200px;filter:blur(6px) saturate(1.5) brightness(0.8)}
#c{left:380px;filter:brightness(1.2) contrast(0.7) opacity(0.6)}
#d{left:560px;filter:hue-rotate(60deg) sepia(0.7)}
#e{left:740px;filter:sepia(0.5) blur(4px) hue-rotate(90deg)}
#f{left:920px;filter:grayscale(0.6) invert(0.5) blur(3px)}
#s1{left:20px;top:200px;width:150px;height:140px;background:#c05030}
#s2{left:170px;top:200px;width:350px;height:140px;background:#2060d0}
#s3{left:520px;top:200px;width:180px;height:140px;background:#30a050}
#g1{left:60px;top:220px;width:220px;height:100px;background:rgba(255,255,255,0.15);backdrop-filter:blur(5px) saturate(1.2) brightness(0.8)}
#g2{left:400px;top:220px;width:220px;height:100px;background:rgba(255,255,255,0.15);backdrop-filter:contrast(1.15) blur(5px) invert(0.9)}
.q{top:400px;width:120px;height:80px;background:#c86432}
#h{left:20px;filter:sepia(1) drop-shadow(8px 8px 0 #2060d0)}
#i{left:200px;filter:blur(3px) invert(0.25);mask-image:linear-gradient(to right,#000000,#000000)}
#j{left:380px;filter:invert(0.25);mask-image:linear-gradient(to right,#000000,#000000)}
</style></head><body>
<div id="a" class="p"><div class="k"></div></div>
<div id="b" class="p"><div class="k"></div></div>
<div id="c" class="p"><div class="k"></div></div>
<div id="d" class="p"><div class="k"></div></div>
<div id="e" class="p"><div class="k"></div></div>
<div id="f" class="p"><div class="k"></div></div>
<div id="s1"></div><div id="s2"></div><div id="s3"></div>
<div id="g1"></div><div id="g2"></div>
<div id="h" class="q"></div><div id="i" class="q"></div><div id="j" class="q"></div>
</body></html>
