[CommonSettings]
SourcePath=Plugins/GameFeatures/ArcRmlUIGameFeatureTest/Content/Localization/ArcRmlUIGameFeatureTest
DestinationPath=Plugins/GameFeatures/ArcRmlUIGameFeatureTest/Content/Localization/ArcRmlUIGameFeatureTest
ManifestName=ArcRmlUIGameFeatureTest.manifest
ArchiveName=ArcRmlUIGameFeatureTest.archive
PortableObjectName=ArcRmlUIGameFeatureTest.po
ResourceName=ArcRmlUIGameFeatureTest.locres
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=pl
CulturesToGenerate=fr
CulturesToGenerate=zh-Hans
CulturesToGenerate=ar

;Gather text from the plugin's assets (its String Tables)
[GatherTextStep0]
CommandletClass=GatherTextFromAssets
IncludePathFilters=Plugins/GameFeatures/ArcRmlUIGameFeatureTest/Content/*
ExcludePathFilters=Plugins/GameFeatures/ArcRmlUIGameFeatureTest/Content/Localization/*
PackageFileNameFilters=*.uasset
PackageFileNameFilters=*.umap
ShouldGatherFromEditorOnlyData=false
SkipGatherCache=false

;Write Manifest
[GatherTextStep1]
CommandletClass=GenerateGatherManifest

;Write Archives
[GatherTextStep2]
CommandletClass=GenerateGatherArchive

;Import localized PO files
[GatherTextStep3]
CommandletClass=InternationalizationExport
bImportLoc=true

;Write Localized Text Resource
[GatherTextStep4]
CommandletClass=GenerateTextLocalizationResource

;Export PO files
[GatherTextStep5]
CommandletClass=InternationalizationExport
bExportLoc=true
