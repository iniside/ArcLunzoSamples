[CommonSettings]
SourcePath=Plugins/ArcRmlUISamples/Content/Localization/ArcRmlUISamples
DestinationPath=Plugins/ArcRmlUISamples/Content/Localization/ArcRmlUISamples
ManifestName=ArcRmlUISamples.manifest
ArchiveName=ArcRmlUISamples.archive
PortableObjectName=ArcRmlUISamples.po
ResourceName=ArcRmlUISamples.locres
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=pl

;Gather text from the plugin's assets (its String Tables)
[GatherTextStep0]
CommandletClass=GatherTextFromAssets
IncludePathFilters=Plugins/ArcRmlUISamples/Content/*
ExcludePathFilters=Plugins/ArcRmlUISamples/Content/Localization/*
PackageFileNameFilters=*.uasset
PackageFileNameFilters=*.umap
ShouldGatherFromEditorOnlyData=false
SkipGatherCache=false

;Write Manifest
[GatherTextStep1]
CommandletClass=GenerateGatherManifest

;Write Archives
[GatherTextStep2]
CommandletClass=GenerateGatherArchive

;Import localized PO files
[GatherTextStep3]
CommandletClass=InternationalizationExport
bImportLoc=true

;Write Localized Text Resource
[GatherTextStep4]
CommandletClass=GenerateTextLocalizationResource

;Export PO files
[GatherTextStep5]
CommandletClass=InternationalizationExport
bExportLoc=true
